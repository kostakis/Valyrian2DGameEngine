## GENERAL

# Allow spacebar jump
ENABLE_JUMP = 1
ENABLE_DOWN_MOVEMENT = 0

#---------------------------------------------

## PLAYER MOVEMENT

# X SPEED of player for regural moving (A,D)
X_SPEED = 4

#---------------------------------------------

## SOUND OPTIONS

SOUND_VOLUME = 0.0

#---------------------------------------------

## DEBUG OPTIONS

SHOW_FPS = 1 

# Map scolling with arrows speed
X_SCROLL_SPEED = 10 

# Mario moving up pressing w key
Y_SPEED = 4

# Affects only WASD keys not jump 0,1
ENABLE_GRAVITY = 1

# 0 -> Mario center-scroll, 1 -> Free follow
CAMERA_MODE = 0

# Render collision grid as 4x4 sub-cells (per-tile shapes). Should be 1 after the performance fixes
SHOW_GRID_SUBCELLS = 1

# Allow player to walk past map edges (0 = Mario pit-death behavior, 1 = hard clamp)
CLAMP_TO_MAP_BOUNDS = 0
